version: '3.8'

services:
  user-service:
    build:
      context: ./src/microservices/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  payment-service:
    build:
      context: ./src/microservices/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  order-service:
    build:
      context: ./src/microservices/order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - PAYMENT_SERVICE_URL=http://payment-service:8002
      - NOTIFY_SERVICE_URL=http://notification-service:8004
    depends_on:
      - payment-service
      - notification-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  notification-service:
    build:
      context: ./src/microservices/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
